services:
  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../:/workspace
    depends_on:
      - api

  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    command: sh -lc "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../:/workspace
    depends_on:
      - db
      - minio
      - redis

  worker:
    image: python:3.12-slim
    working_dir: /workspace/apps/worker
    command: sh -lc "pip install -e . && worker"
    volumes:
      - ../:/workspace
    depends_on:
      - api
      - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energopulse
      POSTGRES_USER: energopulse
      POSTGRES_PASSWORD: energopulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
