services:
  - type: web
    name: kazakhoil-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENERGOPULSE_APP_ENV
        value: production
      - key: ENERGOPULSE_CORS_ALLOW_ORIGINS
        value: https://kazakhoil-energy-poc.onrender.com,https://kazakhoil-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: ENERGOPULSE_DATABASE_URL
        fromDatabase:
          name: kazakhoil-postgres
          property: connectionString
      - key: ENERGOPULSE_STORAGE_ROOT
        value: /tmp/energopulse

  - type: worker
    name: kazakhoil-worker
    runtime: python
    rootDir: apps/worker
    buildCommand: pip install -e .
    startCommand: worker
    envVars:
      - key: ENERGOPULSE_APP_ENV
        value: production
      - key: ENERGOPULSE_DATABASE_URL
        fromDatabase:
          name: kazakhoil-postgres
          property: connectionString
      - key: ENERGOPULSE_STORAGE_ROOT
        value: /tmp/energopulse

  - type: web
    name: kazakhoil-web
    runtime: static
    rootDir: apps/web
    buildCommand: corepack pnpm install --no-frozen-lockfile && corepack pnpm --filter web run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kazakhoil-api.onrender.com

databases:
  - name: kazakhoil-postgres
    databaseName: energopulse
    user: energopulse