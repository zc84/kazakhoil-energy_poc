services:
  - type: web
    name: kazakhoil-energy-poc
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./apps/web/dist
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
